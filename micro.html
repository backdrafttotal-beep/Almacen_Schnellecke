<!DOCTYPE html>
<html lang="es" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Prueba de micrófono</title>
<style>
  :root{ --bg:#0f1115; --card:#171a21; --text:#e9edf5; --dim:#9aa4b2; --ok:#2ecc71; --bad:#ff5a5a; --warn:#ffb020; --acc:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:14px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
  .fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #262b36;font-size:14px}
  .fila:last-child{border-bottom:0}
  .fila b{font-weight:600;color:var(--dim)}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;margin-bottom:10px}
  button.gris{background:#2a3040}
  #log{background:#0b0d12;border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;min-height:120px;color:#cfd6e4}
  .big{font-size:18px;font-weight:700;padding:10px;border-radius:12px;text-align:center;margin-bottom:10px;background:#20252f}
</style>
</head>
<body>
<h1>Prueba de micrófono</h1>
<div class="sub">Almacén Schnellecke · diagnóstico</div>

<div class="card" id="info"></div>

<div class="big" id="estado">Pulsa el botón y di: <b>uno dos tres</b></div>
<button id="btn">🎤 Probar el micrófono</button>
<button id="btnCopiar" class="gris">Copiar el informe</button>

<div id="log"></div>

<script>
var L = document.getElementById('log');
function log(t){ L.textContent += t + "\n"; }
function fila(k,v,cls){ return '<div class="fila"><b>'+k+'</b><span class="'+(cls||'')+'">'+v+'</span></div>'; }

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var html = "";
html += fila('Dirección', location.protocol + '//' + location.hostname, location.protocol==='https:'?'ok':'bad');
html += fila('Reconocimiento de voz', SR ? 'sí existe' : 'NO existe', SR?'ok':'bad');
html += fila('Micrófono (getUserMedia)', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'sí existe' : 'NO existe', (navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?'ok':'bad');
html += fila('Conexión', navigator.onLine ? 'conectado' : 'SIN conexión', navigator.onLine?'ok':'bad');
html += fila('Navegador', (navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0] + (/wv/.test(navigator.userAgent)?' (dentro de otra app)':''), /wv/.test(navigator.userAgent)?'warn':'');
document.getElementById('info').innerHTML = html;

if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'microphone'}).then(function(p){
    var cls = p.state==='granted' ? 'ok' : (p.state==='denied' ? 'bad' : 'warn');
    var txt = p.state==='granted' ? 'concedido' : (p.state==='denied' ? 'BLOQUEADO en esta web' : 'lo preguntará');
    document.getElementById('info').innerHTML += fila('Permiso de esta web', txt, cls);
    if(p.state==='denied') log('>> El permiso del micro está BLOQUEADO para esta web dentro de Chrome.\n   Candado de la barra de direcciones → Permisos → Micrófono → Permitir.');
  }).catch(function(){});
}

var rec = null, hablado = "";

document.getElementById('btn').addEventListener('click', function(){
  L.textContent = "";
  hablado = "";
  document.getElementById('estado').textContent = "Abriendo el micrófono...";
  log('1) Pido el micrófono...');

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    log('   OK: el micrófono se ha abierto.');
    stream.getTracks().forEach(function(t){ t.stop(); });
    arrancarVoz();
  }).catch(function(e){
    log('   FALLO al abrir el micrófono: ' + e.name + ' · ' + e.message);
    if(e.name==='NotAllowedError') log('>> Chrome tiene el micro bloqueado para esta web.\n   Candado arriba → Permisos → Micrófono → Permitir.');
    if(e.name==='NotFoundError') log('>> El teléfono no encuentra ningún micrófono.');
    document.getElementById('estado').textContent = "No se pudo abrir el micrófono";
  });
});

function arrancarVoz(){
  if(!SR){ log('2) Este navegador no trae reconocimiento de voz.'); return; }
  try{ if(rec) rec.abort(); }catch(e){}
  rec = new SR();
  rec.lang = 'es-ES';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 3;

  rec.addEventListener('start', function(){ log('2) Escuchando... DI AHORA: uno dos tres'); document.getElementById('estado').textContent = "Escuchando... di: uno dos tres"; });
  rec.addEventListener('audiostart', function(){ log('   - entra audio'); });
  rec.addEventListener('soundstart', function(){ log('   - se oye sonido'); });
  rec.addEventListener('speechstart', function(){ log('   - detecta VOZ'); });
  rec.addEventListener('speechend', function(){ log('   - deja de hablar'); });
  rec.addEventListener('nomatch', function(){ log('   - oye pero no entiende nada'); });

  rec.addEventListener('result', function(ev){
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal){ hablado += t; log('3) HA ENTENDIDO: "' + t + '"'); }
      else { document.getElementById('estado').textContent = '... ' + t; }
    }
  });

  rec.addEventListener('error', function(ev){
    log('   ERROR: ' + ev.error);
    var m = {
      'not-allowed':'Chrome tiene el micro bloqueado para esta web. Candado arriba → Permisos → Micrófono → Permitir.',
      'service-not-allowed':'El servicio de voz de Google no está disponible en este teléfono. Ajustes → Apps → busca "Servicios de voz de Google" / "Reconocimiento de voz de Google" y actívalo y actualízalo.',
      'network':'No llega al servidor de voz. Hace falta datos o wifi de verdad (y que no haya ahorro de datos bloqueando Chrome).',
      'audio-capture':'No puede capturar audio: puede que otra app tenga cogido el micro.',
      'language-not-supported':'El español no está instalado en el reconocimiento de voz.',
      'aborted':'Se ha cortado solo (aborted). Suele ser el servicio de voz de Google parado o el ahorro de batería.',
      'no-speech':'No ha oído nada. Habla más cerca y más alto.'
    };
    if(m[ev.error]) log('>> ' + m[ev.error]);
    document.getElementById('estado').textContent = 'Error: ' + ev.error;
  });

  rec.addEventListener('end', function(){
    log('4) Fin.');
    if(hablado) document.getElementById('estado').innerHTML = '<span class="ok">FUNCIONA: "'+hablado+'"</span>';
    else if(document.getElementById('estado').textContent.indexOf('Error')!==0) document.getElementById('estado').innerHTML = '<span class="bad">No ha entendido nada</span>';
  });

  try{ rec.start(); }
  catch(e){ log('   No ha podido arrancar: ' + e.message); }
}

document.getElementById('btnCopiar').addEventListener('click', function(){
  var txt = 'PRUEBA DE MICRO\n' + navigator.userAgent + '\n\n' + document.getElementById('info').innerText + '\n\n' + L.textContent;
  if(navigator.share){ navigator.share({text:txt}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ alert('Copiado'); }); }
});
</script>
</body>
</html>
