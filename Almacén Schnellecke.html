<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Almacén Schnellecke</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2129;
    --panel-2:#232a34;
    --line:#323a46;
    --amber:#e8a23d;
    --amber-dim:#7a5a26;
    --text:#eef1f5;
    --text-dim:#98a3b3;
    --green:#4caf7d;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:96px;}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#171b21,#14171c 90%);
    border-bottom:2px solid var(--amber-dim);
    padding:14px 16px 12px;
  }
  header h1{
    margin:0 0 2px;
    font-size:17px;
    letter-spacing:.3px;
    font-weight:700;
  }
  header .sub{font-size:12px;color:var(--text-dim);}
  .repeating-tick{
    position:absolute;inset:0;pointer-events:none;opacity:.06;
    background-image:repeating-linear-gradient(135deg,var(--amber) 0 2px, transparent 2px 14px);
  }

  .meta{
    display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap;
  }
  .meta label{
    flex:1;min-width:130px;
    display:flex;flex-direction:column;gap:4px;
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;
  }
  .meta input{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:14px;
  }
  .meta input:focus{outline:none;border-color:var(--amber);}

  .matricula-box{
    display:flex;align-items:center;gap:10px;padding:12px 16px 4px;flex-wrap:wrap;
  }
  .matricula-box .matricula-label{
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;
    flex:none;
  }
  .matricula-box .matricula-controls{
    display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;min-width:0;
  }
  .matricula-box .matricula-select{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-size:13px;padding:9px 10px;flex:1;min-width:150px;max-width:220px;
  }
  .matricula-box .matricula-select:focus{outline:none;border-color:var(--amber);}
  .matricula-box .matricula-manual-input{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:9px 12px;flex:1;min-width:160px;text-transform:uppercase;
  }
  .matricula-box .matricula-manual-input:focus{outline:none;border-color:var(--amber);}

  .mic-group-btn{
    flex:none;background:#2a6f4f;border:none;border-radius:8px;color:#eafff2;
    font-size:15px;padding:7px 10px;margin:0 8px;
  }
  .mic-group-btn.listening{background:var(--red,#ff5a5a);animation:pulseMicSearch 1s infinite;}
  @keyframes pulseMicSearch{0%,100%{opacity:1;}50%{opacity:.6;}}

  /* ---------- REGISTROS ---------- */
  #registrosView{display:none;padding:8px 10px 0;}
  .registros-datebar{padding:4px 6px 12px;}
  .registros-datebar label{
    display:flex;flex-direction:column;gap:4px;
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;
  }
  .registros-datebar input{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:14px;max-width:220px;
  }
  .registros-datebar input:focus{outline:none;border-color:var(--amber);}
  .reg-empty{color:var(--text-dim);font-size:13px;padding:20px 8px;text-align:center;}
  .reg-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin:0 4px 12px;overflow:hidden;
  }
  .reg-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);
  }
  .reg-head .reg-tag{
    font-size:10px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:20px;
  }
  .reg-tag.carga{background:rgba(232,162,61,.18);color:var(--amber);}
  .reg-tag.descarga{background:rgba(79,179,255,.18);color:#4fb3ff;}
  .reg-head .reg-plate{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
    font-size:14px;letter-spacing:.5px;
  }
  .reg-head .reg-time{font-size:11px;color:var(--text-dim);}
  .reg-del{background:transparent;border:none;color:var(--text-dim);font-size:15px;padding:4px 6px;}
  .reg-body{padding:8px 12px 10px;}
  .reg-item{
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;
    padding:4px 0;border-bottom:1px dashed var(--line);
  }
  .reg-item:last-child{border-bottom:none;}
  .reg-item .reg-item-name{color:var(--text-dim);}
  .reg-item .reg-item-name b{color:var(--text);font-weight:600;}
  .reg-provider{
    font-size:11.5px;font-weight:700;color:var(--amber);letter-spacing:.2px;
    padding:8px 0 3px;
  }
  .reg-provider:first-child{padding-top:0;}
  .reg-item .reg-item-qty{color:var(--green);font-weight:700;}
  .reg-total{
    display:flex;justify-content:space-between;padding:8px 12px;
    border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--amber);
  }

  main{padding:8px 10px 0;}

  .tabbar{
    display:flex;gap:6px;padding:12px 12px 0;
  }
  .tab-btn{
    flex:1;border:1px solid var(--line);background:var(--panel);
    color:var(--text-dim);font-size:10.5px;font-weight:700;letter-spacing:.2px;
    border-radius:9px;padding:10px 4px;line-height:1.25;
  }
  .tab-btn.active{
    background:var(--amber-dim);color:var(--text);border-color:var(--amber);
  }

  .group{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin:10px 4px;overflow:hidden;
  }
  .group-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .group-head .name{
    font-weight:700;font-size:14px;letter-spacing:.3px;
  }
  .group-head .code{
    font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .group-head .subtotal{
    font-size:12px;color:var(--text-dim);white-space:nowrap;
  }
  .group-head .subtotal b{color:var(--green);font-size:13px;}

  /* ancho fijo por columna (en px) -> permite tabla más ancha que la pantalla
     con scroll horizontal, y evita que el texto se solape */
  :root{ --w-cont:88px; --w-den:160px; --w-cant:76px; }

  .table-wrap{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    position:relative;
  }
  .table-wrap::after{
    content:"";position:sticky;display:block;left:100%;top:0;
    width:1px;height:0;
  }
  .scroll-hint{
    font-size:10px;color:var(--text-dim);padding:2px 12px 8px;
    display:flex;align-items:center;gap:4px;
  }

  table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;}
  col.col-cont{width:var(--w-cont);}
  col.col-den{width:var(--w-den);}
  col.col-cant{width:var(--w-cant);}

  thead th{
    font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;
    font-weight:600;padding:5px 3px;text-align:center;border-bottom:1px solid var(--line);
    background:var(--panel);white-space:nowrap;
  }
  thead th.col-cont{text-align:left;padding-left:10px;white-space:normal;line-height:1.15;}
  thead th.col-den{text-align:left;}

  tbody td{padding:6px 3px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}

  /* columnas Cont. y Denominación con ancho fijo, se desplazan junto con el resto de la tabla */
  td.cont{
    padding-left:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:var(--amber);line-height:1.3;
    white-space:normal;word-break:break-word;
  }
  td.den{font-size:12.5px;line-height:1.3;padding-right:6px;white-space:normal;word-break:break-word;}
  td.den .refline{
    display:block;margin-top:2px;font-size:10px;color:var(--text-dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  td.den .refline.refline-hl{
    display:block;width:fit-content;color:#5ec8ff;font-weight:800;
    background:rgba(94,200,255,.14);border:1px solid rgba(94,200,255,.4);
    padding:1px 6px;border-radius:5px;margin-top:3px;
  }

  tr.ubic-row td{
    background:var(--panel-2);padding:8px 8px;border-bottom:1px solid var(--line);
  }
  tr.ubic-row .ubic-label{
    display:block;font-size:10.5px;color:var(--amber);font-weight:700;margin-bottom:5px;
  }
  .ubic-splits{display:flex;flex-direction:column;gap:5px;}
  .split-row{display:flex;gap:5px;align-items:center;}
  .split-row .split-qty{
    flex:none;width:48px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--amber);padding:7px 4px;font-size:12.5px;text-align:center;font-weight:700;
  }
  .split-row .ubic-select{
    flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:7px 6px;font-size:12.5px;
  }
  .split-row .ubic-select:focus{outline:none;border-color:var(--amber);}
  .split-row .ubic-mic-btn{
    flex:none;background:#2a6f4f;border:none;border-radius:7px;color:#eafff2;
    font-size:14px;padding:6px 9px;
  }
  .split-row .ubic-mic-btn.listening{background:var(--red,#ff5a5a);animation:pulseMicUbic 1s infinite;}
  @keyframes pulseMicUbic{0%,100%{opacity:1;}50%{opacity:.6;}}
  .split-row .split-remove-btn{
    flex:none;background:transparent;border:1px solid var(--line);border-radius:7px;
    color:var(--text-dim);font-size:12px;padding:6px 8px;
  }
  .split-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;}
  .split-add-btn{
    background:transparent;border:1px dashed var(--amber-dim);color:var(--amber);
    border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700;
  }
  .split-sum{font-size:11px;font-weight:700;white-space:nowrap;}
  .split-sum.ok{color:var(--green);}
  .split-sum.warn{color:var(--red,#ff5a5a);}

  td.cant input{
    width:100%;text-align:center;background:var(--bg);
    border:1px solid var(--line);border-radius:7px;color:var(--amber);
    font-size:16px;font-weight:700;padding:10px 0;
  }
  td.cant input:focus{outline:none;border-color:var(--amber);background:#1a1e25;}
  td.cant input::-webkit-outer-spin-button,td.cant input::-webkit-inner-spin-button{margin:0;}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(0deg,#14171c 70%, rgba(20,23,28,0));
    padding:10px 12px 14px;
  }
  .footer-inner{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;align-items:center;gap:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .grand-total{flex:1;}
  .grand-total .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
  .grand-total .value{font-size:20px;font-weight:800;color:var(--amber);line-height:1.15;}
  .btn{
    border:none;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn-share{background:#25D366;color:#0b1a10;}
  .btn-text{background:transparent;color:var(--text-dim);border:1px solid var(--line);
    padding:11px 12px;font-size:14px;}
  .btn-clear{background:transparent;color:var(--text-dim);border:1px solid var(--line);
    padding:11px 12px;}
  .btn:active{transform:scale(.96);}

  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--text);
    padding:9px 16px;border-radius:20px;font-size:12.5px;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<header>
  <div class="repeating-tick"></div>
  <h1>Almacén Schnellecke</h1>
  <div class="sub" id="autosaveNote">Rellena por contenedor y matrícula de remolque · se guarda solo en este teléfono</div>
</header>

<div class="meta">
  <label>Fecha
    <input type="date" id="fecha">
  </label>
  <label>Turno / Nombre
    <input type="text" id="turno" placeholder="Ej: Mañana - Juan">
  </label>
</div>

<div class="tabbar" id="tabbar">
  <button class="tab-btn" data-tab="carga">CARGA VACÍOS</button>
  <button class="tab-btn" data-tab="descarga">MATERIAL DESCARGADO</button>
  <button class="tab-btn" data-tab="registros">REGISTROS</button>
</div>

<div class="matricula-box" id="matriculaBox"></div>

<div id="groupsWrap">
  <main id="groups-carga"></main>
  <main id="groups-descarga"></main>
</div>

<div id="registrosView">
  <div class="registros-datebar">
    <label>Fecha
      <input type="date" id="registrosFecha">
    </label>
  </div>
  <div id="registrosList"></div>
</div>

<div class="toast" id="toast"></div>

<footer id="footer">
  <div class="footer-inner">
    <div class="grand-total">
      <div class="label">Total piezas</div>
      <div class="value" id="grandTotal">0</div>
    </div>
    <button class="btn btn-clear" id="clearBtn" title="Vaciar todo">🗑</button>
    <button class="btn btn-text" id="textBtn" title="Enviar solo como texto">Aa</button>
    <button class="btn btn-share" id="shareBtn">📷 Compartir imagen</button>
  </div>
</footer>

// ---------- FUSIONAR CONTENEDORES REPETIDOS (dentro de un mismo proveedor) ----------
// Si varias referencias comparten el mismo número de contenedor, se dejan
// en una sola fila con denominación "Contenedores". Las que tienen un
// contenedor único conservan su referencia y denominación tal cual.
function dedupeByContainer(g){
  const buckets = new Map();
  g.items.forEach(it=>{
    const key = String(it.cont || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    const bucketKey = key || Symbol();
    if(!buckets.has(bucketKey)) buckets.set(bucketKey, []);
    buckets.get(bucketKey).push(it);
  });
  const newItems = [];
  buckets.forEach(list=>{
    if(list.length === 1){
      newItems.push(list[0]);
    }else{
      // preferimos el formato de contenedor sin espacios internos si lo hay
      const canonical = list.find(it=> !/\s/.test(String(it.cont))) || list[0];
      newItems.push({ ref:String(canonical.cont), den:"Contenedores", cont:canonical.cont, showRef:false });
    }
  });
  g.items = newItems;
}
["NEINSA", "AISA"].forEach(name=>{
  const g = DATA_CARGA.find(x=> x.name === name);
  if(g) dedupeByContainer(g);
});

// ---------- TRAER CATÁLOGO DE CARGA VACÍOS TAMBIÉN A MATERIAL DESCARGADO ----------
// Cada proveedor de CARGA VACÍOS (con sus contenedores y denominaciones) se añade
// también a MATERIAL DESCARGADO, creando el proveedor si no existía, y sin duplicar
// referencias que ya estuvieran presentes en MATERIAL DESCARGADO.
DATA_CARGA.forEach(cg=>{

  if(!dg){
    dg = { code: cg.code, name: cg.name, items: [] };

  cg.items.forEach(it=>{

});

// ---------- NORMALIZAR CONTENEDORES A 6 DÍGITOS SEGUIDOS ----------
// Algunos contenedores venían con espacios ("111 940") o con texto delante
// ("70A519760"). Los dejamos siempre como los últimos 6 dígitos, juntos.
function normalizeContainerValue(cont){
  if(cont === undefined || cont === null) return cont;
  if(typeof cont === "number") return cont;
  const digits = String(cont).replace(/[^0-9]/g, "");
  if(digits.length === 0) return cont;          // sin dígitos (ej. "VWPAL/KLTS"): lo dejamos igual
  if(digits.length > 6) return digits.slice(-6); // más de 6: nos quedamos con los 6 últimos
  return digits;                                  // 6 o menos: solo lo dejamos junto
}
[DATA_CARGA, DATA_DESCARGA].forEach(dataset=>{
  dataset.forEach(g=> g.items.forEach(it=>{ it.cont = normalizeContainerValue(it.cont); }));
});

// ---------- ORDEN DE REFERENCIAS POR CONTENEDOR ----------
// Dentro de cada proveedor, ordenamos las referencias de menor a mayor
// según los 3 últimos caracteres del número de contenedor (con o sin letra),
// no por el número completo. Ej: 540473 va antes que 539474 porque 473 < 474.
function contSortKey(cont){
  const raw = String(cont == null ? "" : cont).trim();
  const digits = raw.replace(/[^0-9]/g, "");
  if(!digits) return { num:null, hasLetter:false, letter:"" };
  const last3 = digits.slice(-3);
  const letterMatch = raw.match(/([A-Za-z])\s*$/);
  return { num: parseInt(last3, 10), hasLetter: !!letterMatch, letter: letterMatch ? letterMatch[1].toUpperCase() : "" };
}
function compareByContSuffix(a, b){
  const ka = contSortKey(a.cont), kb = contSortKey(b.cont);
  if(ka.num === null && kb.num === null) return 0;
  if(ka.num === null) return 1;   // sin números: al final
  if(kb.num === null) return -1;
  if(ka.num !== kb.num) return ka.num - kb.num;
  // mismo número: primero los que no tienen letra al final
  if(ka.hasLetter !== kb.hasLetter) return ka.hasLetter ? 1 : -1;
  // si ambos tienen letra, orden alfabético por esa letra
  return ka.letter.localeCompare(kb.letter);
}
[DATA_CARGA, DATA_DESCARGA].forEach(dataset=>{
  dataset.forEach(g=>{
    const field = g.sortBy || "cont";
    g.items.sort((a,b)=> compareByContSuffix({cont:a[field]}, {cont:b[field]}));
  });
});

// tanto en CARGA VACÍOS como en MATERIAL DESCARGADO. El resto de
// proveedores se queda tal cual estaba.
function reorderGroups(dataset){
  const priority = ["NEINSA", "KWD", "GESTAMP"];
  const top = [];
  priority.forEach(name=>{
    const idx = dataset.findIndex(g=> g.name === name);
    if(idx !== -1) top.push(dataset.splice(idx, 1)[0]);
  });
  dataset.unshift(...top);
}

// Vuelca las ubicaciones prefijadas en knownLocations sin pisar las que el
// usuario ya haya aprendido por voz (esas se quedan las primeras de la lista).
const PRESET_VERSION = 3;
function applyPresetLocations(){
  // Si las fichas han cambiado desde la ultima vez, las referencias con ficha
  // se reinician para que no arrastren ubicaciones antiguas ya corregidas.
  if(state.presetVersion !== PRESET_VERSION){
    Object.keys(state.knownLocations).forEach(ref=>{
      if(PRESET_LOCATIONS[normRef(ref)]) delete state.knownLocations[ref];
    });
    state.presetVersion = PRESET_VERSION;
  }
  [DATA_CARGA, DATA_DESCARGA].forEach(dataset=>{
    dataset.forEach(g=> g.items.forEach(it=>{
      const preset = PRESET_LOCATIONS[normRef(it.ref)];
      if(!preset) return;
      if(!state.knownLocations[it.ref]) state.knownLocations[it.ref] = [];
      const list = state.knownLocations[it.ref];
      preset.forEach(loc=>{
        if(!list.some(l=> l.toLowerCase() === loc.toLowerCase())) list.push(loc);
      });
    }));
  });
}

function saveHistoryRecord(tab){
  const items = [];
  tab.data.forEach(g=>{
    g.items.forEach(it=>{
      const k = tab.id + ":" + g.code + "__" + it.ref;
      const qty = rowTotal(tab.id + ":" + g.code, it.ref);
      if(qty > 0){
        const item = { ref: it.ref, den: it.den, cont: it.cont, group: g.name, qty };
        const splits = (state.locSplits[k] || []).filter(s=> (s.ubic&&s.ubic.trim()) && Number(s.qty)>0);
        if(splits.length) item.locSplits = splits.map(s=>({ ubic:s.ubic, qty:Number(s.qty) }));
        items.push(item);
      }
    });
  });
  if(items.length === 0) return;
  state.history.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    date: state.fecha,
    tabId: tab.id,
    tabLabel: tab.label,
    matricula: matriculaLabel(tab.id),
    turno: state.turno,
    items,
    total: items.reduce((s,it)=> s+it.qty, 0),
    ts: Date.now()
  });
}

// ---------- BUSCAR REFERENCIA POR VOZ (lleva directo a la fila) ----------
const WORD_NUM = {
  "cero":0,"uno":1,"una":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,"seis":6,"siete":7,"ocho":8,"nueve":9,
  "diez":10,"once":11,"doce":12,"trece":13,"catorce":14,"quince":15,
  "dieciseis":16,"diecisiete":17,"dieciocho":18,"diecinueve":19,
  "veinte":20,"veintiuno":21,"veintidos":22,"veintitres":23,"veinticuatro":24,"veinticinco":25,
  "veintiseis":26,"veintisiete":27,"veintiocho":28,"veintinueve":29,
  "treinta":30,"cuarenta":40,"cincuenta":50,"sesenta":60,"setenta":70,"ochenta":80,"noventa":90,
  "cien":100,"ciento":100,"doscientos":200,"trescientos":300,"cuatrocientos":400,"quinientos":500,
  "seiscientos":600,"setecientos":700,"ochocientos":800,"novecientos":900
};
function parseSpokenNumber(transcript){
  const tokens = transcript.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  const groups = [];
  let current = null, pendingY = false;
  tokens.forEach(tok=>{
    if(tok === "y"){ pendingY = true; return; }
    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok,10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];
    if(val !== null){
      const canAdd = current !== null && (pendingY || (current>=100 && current%100===0));
      if(canAdd) current += val;
      else{ if(current!==null) groups.push(String(current)); current = val; }
      pendingY = false;
      return;
    }
    if(/^[a-e]$/.test(tok)){
      if(current!==null){ groups.push(String(current)); current=null; }
      groups.push(tok.toUpperCase());
      pendingY = false;
      return;
    }
    if(current!==null){ groups.push(String(current)); current=null; }
    pendingY = false;
  });
  if(current!==null) groups.push(String(current));
  return groups.join("");
}
function cleanRefVoice(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function refVariantsVoice(ref){
  const m = String(ref||"").match(/^(.*?)(\d+)\s*\/\s*(\d+)\s*$/);
  if(!m) return [cleanRefVoice(ref)];
  const prefix = m[1], num1 = m[2], suf2 = m[3];
  const num2 = num1.slice(0, Math.max(0, num1.length - suf2.length)) + suf2;
  return [cleanRefVoice(prefix + num1), cleanRefVoice(prefix + num2)];
}

}

// ---------- UBICACIÓN POR REFERENCIA, CON REPARTO ENTRE VARIAS (Material Descargado) ----------
// state.locSplits[key] = [{ ubic:"", qty:0 }, ...]  -> permite dejar, por ejemplo,
// 6 piezas en "PL 30" y 4 en "Pulmón instalación" para la misma referencia.

function getSplits(key, total){
  let splits = state.locSplits[key];
  if(!splits || splits.length === 0){
    // primer vistazo: si habia una ubicacion "antigua" de una sola casilla, la recuperamos;
    // si no, mostramos un unico reparto de partida con toda la cantidad
    const legacy = state.ubicaciones[key] || "";
    splits = [{ ubic: legacy, qty: total }];
  }
  return splits;
}

function splitsSum(splits){
  return splits.reduce((s,x)=> s + (Number(x.qty)||0), 0);
}

function locOptionsHTML(ref, selected){
  const known = state.knownLocations[ref] || [];
  const opts = known.map(loc=>{
    const esc = loc.replace(/"/g,'&quot;');
    return `<option value="${esc}" ${loc===selected?"selected":""}>${esc}</option>`;
  }).join("");
  return `<option value="" ${selected?"":"selected"} disabled>${known.length ? "Selecciona…" : "Usa el micro"}</option>${opts}`;
}

function renderUbicBlockHTML(key, ref, total){
  const splits = getSplits(key, total);
  const sum = splitsSum(splits);
  const refEsc = ref.replace(/"/g,'&quot;');
  const rows = splits.map((sp, i)=> `
    <div class="split-row" data-key="${key}" data-idx="${i}">
      <input type="number" class="split-qty" inputmode="numeric" min="0" pattern="[0-9]*" value="${sp.qty || ""}" placeholder="0">
      <select class="ubic-select" data-key="${key}" data-idx="${i}" data-ref="${refEsc}">
        ${locOptionsHTML(ref, sp.ubic)}
      </select>
      <button class="ubic-mic-btn" data-key="${key}" data-idx="${i}" title="Decir la ubicación">&#127908;</button>
      ${splits.length > 1 ? `<button class="split-remove-btn" data-key="${key}" data-idx="${i}" title="Quitar este reparto">✕</button>` : ""}
    </div>
  `).join("");

  return `
    <span class="ubic-label">📍 Ubicación${splits.length>1 ? " (repartida)" : ""}</span>
    <div class="ubic-splits" data-key="${key}" data-ref="${refEsc}" data-total="${total}">
      ${rows}
    </div>
    <div class="split-foot">
      <button class="split-add-btn" data-key="${key}" data-ref="${refEsc}" data-total="${total}">➕ Repartir en otra ubicación</button>
      <span class="split-sum ${sum===total ? "ok" : "warn"}">Repartido: ${sum} / ${total}</span>
    </div>
  `;
}

function refreshUbicBlock(key){
  const container = groupsWrapEl.querySelector(`tr.ubic-row[data-for-key="${CSS.escape(key)}"] td`);
  if(!container) return;
  const splitsWrap = container.querySelector(".ubic-splits");
  const refAttr = splitsWrap ? splitsWrap.dataset.ref : "";
  const total = splitsWrap ? Number(splitsWrap.dataset.total)||0 : 0;

}

function setSplits(key, ref, splits){
  let clean = splits.length ? splits : [{ ubic:"", qty:0 }];
  state.locSplits[key] = clean;

  // aprendemos las ubicaciones nuevas para esta referencia
  clean.forEach(s=>{
    let clean_ubic = (s.ubic||"").trim();
    if(!clean_ubic) return;
    if(!state.knownLocations[ref]) state.knownLocations[ref] = [];
    const list = state.knownLocations[ref];
    // comparamos sin espacios/guiones y colapsando letras repetidas, para que
    // "EBC025" dicho por voz reconozca la ficha oficial "EBC C-025"
    const flat = v => String(v).replace(/[^A-Za-z0-9]/g, "").toUpperCase()
                               .replace(/([A-Z])\1+/g, "$1");
    const digitsOf = v => (String(v).match(/(\d+)\s*$/) || [])[1] || "";
    let idx = list.findIndex(l=> flat(l) === flat(clean_ubic));
    if(idx === -1 && /^\d+$/.test(clean_ubic)){
      // si solo dice el numero ("70"), lo casamos con "EBF PLANE70"
      idx = list.findIndex(l=> digitsOf(l) === clean_ubic.replace(/^0+(?=\d)/, "")
                            || digitsOf(l) === clean_ubic);
    }
    if(idx !== -1){
      clean_ubic = list[idx];   // conservamos el formato oficial de la hoja
      s.ubic = clean_ubic;
      list.splice(idx,1);
    }
    list.unshift(clean_ubic);
    if(list.length > 14) list.length = 14;
  });

  saveState();
  refreshUbicBlock(key);
}

// Reconoce ubicaciones tipo codigo (letras + numeros seguidos, ej. "EBC cero sesenta y cinco" -> "EBC065",
// o solo numeros "cero tres" -> "03"). Si lo dicho no encaja en ese patron (ej. "Pulmón instalación",
// "Trasvases"), devuelve null y se usa el texto tal cual, capitalizado.
function parseUbicacionCodigo(transcript){
  const tokens = transcript.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  let prefix = "", digitGroups = [], currentNum = null, pendingY = false, allRecognized = true;

  tokens.forEach(tok=>{
    if(tok === "y"){ pendingY = true; return; }

    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok,10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];
    if(val !== null){
      const canAdd = currentNum !== null && (pendingY || (currentNum>=100 && currentNum%100===0));
      if(canAdd) currentNum += val;
      else { if(currentNum!==null) digitGroups.push(String(currentNum)); currentNum = val; }
      pendingY = false;
      return;
    }

    let L = null;
    if(tok.length === 1 && /[a-z]/.test(tok)) L = tok.toUpperCase();
    else if(tok in PLATE_LETTER_MAP) L = PLATE_LETTER_MAP[tok];
    if(L){
      if(currentNum !== null){ digitGroups.push(String(currentNum)); currentNum = null; }
      prefix += L;
      pendingY = false;
      return;
    }

    // palabra que no es ni numero ni nombre de letra -> no encaja en el patron "codigo corto"
    allRecognized = false;
  });
  if(currentNum !== null) digitGroups.push(String(currentNum));

  const digits = digitGroups.join("");
  if(allRecognized && (prefix || digits)) return prefix + digits;
  return null;
}

// ---------- MATRÍCULA POR VOZ ----------
const PLATE_LETTER_MAP = {
  "a":"A","be":"B","ce":"C","de":"D","e":"E","efe":"F","ge":"G","hache":"H",
  "i":"I","jota":"J","ka":"K","ca":"K","ele":"L","eme":"M","ene":"N",
  "o":"O","pe":"P","cu":"Q","ere":"R","erre":"R","ese":"S","te":"T",
  "u":"U","uve":"V","ve":"V","uvedoble":"W","doblev":"W","equis":"X",
  "ye":"Y","igriega":"Y","zeta":"Z",
};
function parsePlate(transcript){
  const rawTokens = transcript.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);

  // el reconocedor de voz a veces pega letras y numeros sin espacio (ej. "r9806" o "bbp"):
  // separamos esos casos en piezas sueltas antes de interpretar la matricula
  const tokens = [];
  rawTokens.forEach(t=>{
    const pieces = t.match(/[a-z]+|[0-9]+/g) || [t];
    pieces.forEach(p=>{
      if(/^[a-z]+$/.test(p) && p.length > 1 && !(p in PLATE_LETTER_MAP) && !(p in WORD_NUM)){
        p.split("").forEach(ch=> tokens.push(ch)); // letras pegadas (ej. "bbp") -> una a una
      }else{
        tokens.push(p);
      }
    });
  });

  let prefix = "", suffix = "", phase = "prefix";
  const digitGroups = [];
  let currentNum = null, pendingY = false;
  function flushNum(){
    if(currentNum !== null){ digitGroups.push(String(currentNum)); currentNum = null; }
  }

  tokens.forEach(tok=>{
    if(tok === "griega") return;
    if(tok === "y"){ pendingY = true; return; }

    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok,10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];

    if(val !== null){
      phase = "digits";
      // combinamos numeros como "treinta y dos" en 32 en lugar de trocearlos en digitos sueltos
      const canAdd = currentNum !== null && (pendingY || (currentNum>=100 && currentNum%100===0));
      if(canAdd) currentNum += val;
      else { flushNum(); currentNum = val; }
      pendingY = false;
      return;
    }

    // no es un numero: si veniamos acumulando uno, lo cerramos antes de seguir
    flushNum();
    pendingY = false;

    if(tok.length === 1 && /[a-z]/.test(tok)){
      const L = tok.toUpperCase();
      if(phase === "prefix"){ if(L === "R") prefix += L; }
      else { phase = "suffix"; suffix += L; }
      return;
    }
    if(tok in PLATE_LETTER_MAP){
      const L = PLATE_LETTER_MAP[tok];
      if(phase === "prefix"){ if(L === "R") prefix += L; }
      else { phase = "suffix"; suffix += L; }
    }
  });
  flushNum();

  const digits = digitGroups.join("").slice(0,4);
  suffix = suffix.slice(0,3);
  return [prefix, digits, suffix].filter(Boolean).join(" ");
}

let matriculaRecognition = null;
let activeMatriculaCtx = null;
if(SpeechRecognitionCtorApp){
  matriculaRecognition = new SpeechRecognitionCtorApp();
  matriculaRecognition.lang = "es-ES";
  matriculaRecognition.continuous = false;
  matriculaRecognition.interimResults = false;

  matriculaRecognition.addEventListener("start", ()=>{
    if(activeMatriculaCtx) activeMatriculaCtx.btnEl.classList.add("listening");
    showToast("Escuchando... di la matrícula");
  });
  matriculaRecognition.addEventListener("end", ()=>{
    if(activeMatriculaCtx) activeMatriculaCtx.btnEl.classList.remove("listening");
  });
  matriculaRecognition.addEventListener("error", ()=>{
    if(activeMatriculaCtx) activeMatriculaCtx.btnEl.classList.remove("listening");
    showToast("El micrófono no funciona así (archivo local) · usa el teclado, o sube la app a un enlace https");
  });
  matriculaRecognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    const plate = parsePlate(transcript);
    if(!activeMatriculaCtx) return;
    const { tabId, inputEl } = activeMatriculaCtx;
    if(!plate){
      showToast(`No he podido interpretar "${transcript}" como matrícula`);
      return;
    }
    state.matriculas[tabId] = { num:"", let:"", text: plate };
    state.dirty[tabId] = true;
    saveState();
    if(inputEl) inputEl.value = plate;
    showToast(`Matrícula: "${plate}"`);
  });
}
function startMatriculaVoice(tabId, inputEl, btnEl){
  if(!matriculaRecognition){
    showToast("El micrófono no está disponible aquí: usa el teclado para escribir la matrícula");
    return;
  }
  activeMatriculaCtx = { tabId, inputEl, btnEl };
  try{ matriculaRecognition.start(); }catch(err){}
}

function switchTab(id){
  activeTabId = id;
  state.activeTab = id;
  saveState();
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === id);
  });

  const registrosViewEl = document.getElementById("registrosView");
  const footerEl = document.getElementById("footer");

  if(id === "registros"){
    matriculaBoxEl.style.display = "none";
    groupsWrapEl.style.display = "none";
    footerEl.style.display = "none";
    registrosViewEl.style.display = "block";
    if(!registrosFechaEl.value) registrosFechaEl.value = state.fecha || "";
    renderRegistros();
    return;
  }

  matriculaBoxEl.style.display = "";
  groupsWrapEl.style.display = "";
  footerEl.style.display = "";
  registrosViewEl.style.display = "none";

  Object.keys(mainEls).forEach(k=>{
    mainEls[k].style.display = (k === id) ? "" : "none";
  });
  renderMatricula();
  refreshTotals();
}

document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click", ()=> switchTab(b.dataset.tab));
});

function onInput(e){
  const { code, ref } = e.target.dataset;
  const k = keyFor(code, ref);
  const val = e.target.value.replace(/[^0-9]/g,"");
  e.target.value = val;
  if(val === ""){ delete state.values[k]; }
  else{ state.values[k] = parseInt(val,10); }
  const tabId = code.split(":")[0];
  state.dirty[tabId] = true;
  saveState();
  refreshTotals();

  if(tabId === "descarga"){
    const ubicRow = e.target.closest("tr").nextElementSibling;
    if(ubicRow && ubicRow.classList.contains("ubic-row")){
      const newTotal = (val !== "") ? parseInt(val,10) : 0;
      ubicRow.style.display = newTotal > 0 ? "" : "none";
      if(newTotal > 0){
        const td = ubicRow.querySelector("td");
        td.innerHTML = renderUbicBlockHTML(k, ref, newTotal);
      }
    }
  }
}

function refreshTotals(){
  TABS.forEach(tab=>{
    tab.data.forEach(g=>{
      const subEl = document.getElementById(`sub-${tab.id}-${g.code}-${g.name}`);
      if(subEl) subEl.textContent = groupTotal(g, tab.id);
    });
  });
  grandTotalEl.textContent = grandTotal();
}

fechaEl.addEventListener("change", ()=>{ state.fecha = fechaEl.value; saveState(); });
turnoEl.addEventListener("input", ()=>{ state.turno = turnoEl.value; saveState(); });

// ---------- ACCIONES ----------
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 2200);
}

function buildSegments(tab){
  tab = tab || currentTab();
  const fecha = state.fecha ? new Date(state.fecha+"T00:00:00").toLocaleDateString("es-ES") : "(sin fecha)";
  const turno = state.turno ? state.turno : "(sin indicar)";
  let segs = [];
  segs.push({type:"title", text: tab.title});
  segs.push({type:"meta", text:`${fecha}   ·   ${turno}`});
  segs.push({type:"truck", text: matriculaLabel(tab.id)});
  segs.push({type:"spacer"});

  const groupsWithData = tab.data.map(g=>{
    const items = g.items.filter(it=>{
      const k = keyFor(tab.id + ":" + g.code, it.ref);
      return (parseInt(state.values[k]) || 0) > 0;
    });
    return { g, items };
  }).filter(x=> x.items.length > 0);

  groupsWithData.forEach(({g, items})=>{
    segs.push({type:"group", text: `${g.name} (${g.code})`});
    items.forEach(it=>{
      const k = keyFor(tab.id + ":" + g.code, it.ref);
      const label = (tab.id === "carga" && it.cont) ? String(it.cont) : it.ref;
      segs.push({type:"item", ref: label, den: it.den, qty: state.values[k]});
      if(tab.id === "descarga"){
        const splits = (state.locSplits[k] || []).filter(s=> (s.ubic&&s.ubic.trim()) && Number(s.qty)>0);
        splits.forEach(s=>{
          segs.push({type:"item-loc", text: s.ubic, qty: s.qty});
        });
      }
    });
  });

  segs.push({type:"spacer"});
  segs.push({type:"total", text:`TOTAL GENERAL: ${grandTotal(tab)} piezas`});
  return segs;
}

function segmentsToText(segs){
  return segs.map(s=>{
    switch(s.type){
      case "title": return `📋 *${s.text}*`;
      case "meta": return `📅 ${s.text}`;
      case "truck": return `🚚 *${s.text}*`;
      case "group": return `🔹 ${s.text}`;
      case "item": return `• ${s.ref} — ${s.den}: *${s.qty}*`;
      case "item-loc": return `   📍 ${s.text}: ${s.qty}`;
      case "subtotal": return s.text;
      case "total": return `✅ *${s.text}*`;
      case "spacer": return "";
    }
  }).join("\n");
}

function buildMessage(tab){
  return segmentsToText(buildSegments(tab));
}

// ---------- IMAGEN ----------
// Todo se dibuja centrado y el ancho del lienzo se ajusta al contenido real,
// para que en WhatsApp la imagen salga compacta y sin margenes vacios.
const IMG_COL = { bg:"#12151a", panel:"#1c2129", text:"#eef1f5", dim:"#98a3b3",
  ref:"#4fb3ff", qty:"#ff5a5a", amber:"#e8a23d", green:"#4caf7d" };
const IMG_H = { title:60, meta:36, spacer:20, truck:52, group:44, item:40, "item-loc":30, subtotal:44, total:70 };

// Cada segmento se convierte en trozos de texto con su fuente y color.
function segmentPieces(s){
  const SANS = "system-ui,sans-serif";
  switch(s.type){
    case "title":    return [{t:"\uD83D\uDCCB " + s.text, f:"700 40px "+SANS, c:IMG_COL.text}];
    case "meta":     return [{t:s.text, f:"500 24px "+SANS, c:IMG_COL.dim}];
    case "truck":    return [{t:"\uD83D\uDE9A " + s.text, f:"700 30px "+SANS, c:IMG_COL.amber}];
    case "group":    return [{t:"\uD83D\uDD39 " + s.text, f:"700 26px "+SANS, c:IMG_COL.text}];
    case "item": {
      const p = [{t:s.ref, f:"700 24px ui-monospace,Menlo,monospace", c:IMG_COL.ref}];
      p.push({t: s.den ? " \u2014 " + s.den + ": " : ": ", f:"24px "+SANS, c:IMG_COL.text});
      p.push({t:String(s.qty), f:"800 27px "+SANS, c:IMG_COL.qty});
      return p;
    }
    case "item-loc": return [{t:"\uD83D\uDCCD " + s.text + ": " + s.qty, f:"italic 21px "+SANS, c:IMG_COL.amber}];
    case "subtotal": return [{t:s.text, f:"700 26px "+SANS, c:IMG_COL.green}];
    case "total":    return [{t:"\u2705 " + s.text, f:"800 32px "+SANS, c:IMG_COL.green}];
    default:         return [];
  }
}

function piecesWidth(ctx, pieces){
  return pieces.reduce((w,p)=>{ ctx.font = p.f; return w + ctx.measureText(p.t).width; }, 0);
}

function renderReportCanvas(tab){
  const segs = buildSegments(tab);
  const PAD = 40, MIN_W = 620, MAX_W = 1200;

  // lienzo temporal solo para medir
  const meas = document.createElement("canvas").getContext("2d");
  let contentW = 0;
  const laid = segs.map(s=>{
    const pieces = segmentPieces(s);
    const w = piecesWidth(meas, pieces);
    if(w > contentW) contentW = w;
    return { s, pieces, w };
  });

  const W = Math.min(MAX_W, Math.max(MIN_W, Math.ceil(contentW) + PAD*2));
  let totalH = PAD*2;
  segs.forEach(s=> totalH += IMG_H[s.type]);

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = totalH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = IMG_COL.bg; ctx.fillRect(0, 0, W, totalH);

  let y = PAD;
  laid.forEach(({s, pieces, w})=>{
    const h = IMG_H[s.type];
    const cy = y + h/2;

    if(s.type === "total"){
      ctx.fillStyle = IMG_COL.panel;
      ctx.fillRect(PAD-16, y+4, W-(PAD-16)*2, h-8);
      ctx.strokeStyle = IMG_COL.green; ctx.lineWidth = 2;
      ctx.strokeRect(PAD-16, y+4, W-(PAD-16)*2, h-8);
    }

    // dibujamos los trozos seguidos, arrancando en el punto que deja
    // el bloque entero centrado en el lienzo
    let x = (W - w) / 2;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    pieces.forEach(p=>{
      ctx.font = p.f; ctx.fillStyle = p.c;
      ctx.fillText(p.t, x, cy);
      x += ctx.measureText(p.t).width;
    });

    y += h;
  });

  return canvas;
}

async function shareReportImage(){
  const tab = currentTab();
  if(grandTotal(tab) === 0){
    showToast("Todavía no has introducido ninguna cantidad");
    return;
  }
  if(state.dirty[tab.id] !== false){
    saveHistoryRecord(tab);
    state.dirty[tab.id] = false;
    saveState();
  }
  const canvas = renderReportCanvas(tab);
  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast("No se pudo generar la imagen"); return; }
    const file = new File([blob], tab.id + ".png", { type: "image/png" });
    try{
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title: tab.title });
        return;
      }
    }catch(e){ /* el usuario canceló el share o no está soportado: seguimos con la descarga */ }
    // Fallback: descargar la imagen para adjuntarla manualmente en WhatsApp
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = tab.id + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast("Imagen descargada · adjúntala en WhatsApp");
  }, "image/png");
}

document.getElementById("shareBtn").addEventListener("click", shareReportImage);


document.getElementById("textBtn").addEventListener("click", ()=>{
  const tab = currentTab();
  if(grandTotal(tab) === 0){
    showToast("Todavía no has introducido ninguna cantidad");
    return;
  }
  const text = buildMessage(tab);
  const url = "https://wa.me/?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
});

const clearBtnEl = document.getElementById("clearBtn");
let clearArmed = false;
let clearArmedTimeout = null;
clearBtnEl.addEventListener("click", ()=>{
  const tab = currentTab();
  if(!clearArmed){
    clearArmed = true;
    clearBtnEl.textContent = "⚠️";
    clearBtnEl.title = "Toca otra vez para vaciar";
    clearArmedTimeout = setTimeout(()=>{
      clearArmed = false; clearBtnEl.textContent = "🗑"; clearBtnEl.title = "Vaciar todo";
    }, 3000);
    return;
  }
  clearTimeout(clearArmedTimeout);
  clearArmed = false;
  clearBtnEl.textContent = "🗑";
  clearBtnEl.title = "Vaciar todo";
  {
    if(state.dirty[tab.id] !== false && grandTotal(tab) > 0){
      saveHistoryRecord(tab);
    }
    tab.data.forEach(g=>{
      g.items.forEach(it=>{
        const k = keyFor(tab.id + ":" + g.code, it.ref);
        delete state.values[k];
        delete state.ubicaciones[k];
        delete state.locSplits[k];
      });
    });
    state.matriculas[tab.id] = { num:"", let:"", text:"" };
    state.matriculaMode[tab.id] = "";
    state.dirty[tab.id] = true;
    saveState();
    renderMatricula();
    render();
    showToast("Formulario vaciado, listo para el siguiente remolque");
  }
});

// ---------- INIT ----------
loadState();
if(!state.fecha){
  const today = new Date();
  state.fecha = today.toISOString().slice(0,10);
}
activeTabId = (state.activeTab && TABS.some(t=>t.id===state.activeTab)) ? state.activeTab : "carga";
render();
switchTab(activeTabId);
</script>
